# Rubrica: organização do docker-compose.yml com serviços, volumes, redes e variáveis de ambiente
name: dw-estoque

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      # Rubrica: persistência de dados no MySQL com volume
      - mysql-dados:/var/lib/mysql
    networks:
      - rede-dw

volumes:
  mysql-dados:

networks:
  rede-dw:
